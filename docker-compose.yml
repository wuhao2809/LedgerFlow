services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        PROJECT: LedgerFlow.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ledgerflow;Username=ledgerflow;Password=ledgerflow
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      args:
        PROJECT: LedgerFlow.Worker
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ledgerflow;Username=ledgerflow;Password=ledgerflow
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector:0.137.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro

volumes:
  postgres_data:
